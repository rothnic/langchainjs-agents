name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '18'

permissions:
  contents: read
  models: read  # Required for GitHub Models access

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          USE_REAL_APIS: false
          LLM_PROVIDER: github-models
          GITHUB_TOKEN: test_token
          OPENAI_API_KEY: test_key
          LANGCHAIN_API_KEY: test_key

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: matrix.node-version == '18'
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check build artifacts
        run: |
          ls -la dist/
          test -f dist/index.js
          test -f dist/index.d.ts

  integration-tests:
    name: Integration Tests (GitHub Models)
    runs-on: ubuntu-latest
    needs: [build]
    # Only run on main branch pushes or when manually triggered
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch') ||
      contains(github.event.pull_request.labels.*.name, 'test:integration')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests with GitHub Models
        run: npm run test:integration
        env:
          NODE_ENV: test
          USE_REAL_APIS: true
          LLM_PROVIDER: github-models
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sample-runs:
    name: Sample Agent Runs
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Test CLI scaffolding
        run: |
          echo "Testing agent scaffolding..."
          npm run scaffold -- --name=ci-test-agent --type=basic
          test -d agents/ci-test-agent
          test -f agents/ci-test-agent/README.md
          test -f agents/ci-test-agent/src/agent.ts
          test -f agents/ci-test-agent/tests/agent.test.ts
          
          echo "Testing generated agent..."
          npm run test:unit agents/ci-test-agent

      - name: Run structured scraping example (with test server)
        run: |
          echo "Running structured scraping example with GitHub Models..."
          # Test with GitHub Models using built-in test server
          timeout 60s npm run test:integration:manual examples/structured-scraping || echo "Integration test completed"
        env:
          LLM_PROVIDER: github-models
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_REAL_APIS: true
